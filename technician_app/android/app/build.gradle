plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.strupeni.technician_app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    flavorDimensions "env"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.strupeni.technician_app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders["appLabel"] = "Tecnicos Strupeni"
    }

    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders["appLabel"] = "Tecnicos Strupeni DEV"
        }

        qa {
            dimension "env"
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
            manifestPlaceholders["appLabel"] = "Tecnicos Strupeni QA"
        }

        prod {
            dimension "env"
            manifestPlaceholders["appLabel"] = "Tecnicos Strupeni"
        }
    }

    buildTypes {
        release {
            // Firmar con debug key para desarrollo (cambiar en producción)
            signingConfig signingConfigs.debug
            
            // Habilitar minificación básica (no agresiva para evitar problemas)
            minifyEnabled false
            shrinkResources false
        }
    }
    
    // Split APK por arquitectura para reducir tamaño
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
