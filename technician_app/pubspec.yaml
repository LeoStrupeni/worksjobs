name: technician_app
description: App móvil para técnicos - Gestión de citas Strupeni Electrónica
publish_to: 'none'

# Versión de la app: MAJOR.MINOR.PATCH+BUILD_NUMBER
# - MAJOR: Cambios incompatibles (1.0.0 → 2.0.0)
# - MINOR: Nuevas funcionalidades compatibles (1.0.0 → 1.1.0)
# - PATCH: Bug fixes (1.0.0 → 1.0.1)
# - BUILD_NUMBER: Número de compilación incremental (Android versionCode, iOS CFBundleVersion)
# 
# Ejemplo: 
#   versión: 1.2.3+15
#   → Versión visible: "1.2.3" (versionName en Android)
#   → Número de build: 15 (versionCode en Android, CFBundleVersion en iOS)
#
# IMPORTANTE: Cambiar ANTES de compilar cada nueva versión
# v1.3.1+31: FIX pantalla gris presupuestos + debounce botones crear/editar
version: 1.3.2+36

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  http: ^1.1.2
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Date & Time
  intl: ^0.20.2
  table_calendar: ^3.0.9
  
  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.1.0
  
  # Media
  image_picker: ^1.0.7
  
  # Share & Download
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  gal: ^2.3.0
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Utils
  flutter_launcher_icons: ^0.13.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Aquí puedes añadir assets cuando los necesites
  # assets:
  #   - images/
  #   - icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
