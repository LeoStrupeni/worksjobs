<!DOCTYPE html>
<html>
<head>
    <title>Test CMS Media</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .image-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .image-item { border: 1px solid #ddd; padding: 10px; }
        .image-item img { width: 100%; height: 150px; object-fit: cover; }
        .info { background: #f0f0f0; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Test CMS Media API</h1>
    
    <div class="info">
        <strong>Endpoint:</strong> <span id="endpoint"></span><br>
        <strong>Status:</strong> <span id="status"></span>
    </div>
    
    <button onclick="testAPI()">Cargar Imágenes</button>
    
    <h2>Resultados:</h2>
    <pre id="json-response"></pre>
    
    <h2>Imágenes:</h2>
    <div class="image-grid" id="image-grid"></div>
    
    <script>
        const app_url = 'http://localhost';
        const endpoint = `${app_url}/cms/media?type=image&format=data`;
        
        document.getElementById('endpoint').textContent = endpoint;
        
        function testAPI() {
            document.getElementById('status').textContent = 'Cargando...';
            
            fetch(endpoint, {
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                document.getElementById('status').textContent = `HTTP ${response.status}`;
                return response.json();
            })
            .then(data => {
                console.log('Response:', data);
                document.getElementById('json-response').textContent = JSON.stringify(data, null, 2);
                
                if (data.media && data.media.data) {
                    const grid = document.getElementById('image-grid');
                    grid.innerHTML = '';
                    
                    data.media.data.forEach(item => {
                        let imagePath = item.path;
                        let displayPath = imagePath;
                        
                        console.log('Original path:', imagePath);
                        
                        if (imagePath.startsWith('cms-media/')) {
                            displayPath = '/storage/' + imagePath;
                        } else if (!imagePath.startsWith('/storage/') && !imagePath.startsWith('storage/')) {
                            displayPath = '/' + imagePath;
                        }
                        
                        const fullUrl = displayPath.startsWith('/') ? app_url + displayPath : app_url + '/' + displayPath;
                        
                        console.log('Display path:', displayPath);
                        console.log('Full URL:', fullUrl);
                        
                        const div = document.createElement('div');
                        div.className = 'image-item';
                        div.innerHTML = `
                            <img src="${fullUrl}" alt="${item.filename}" 
                                 onerror="this.style.border='2px solid red';">
                            <small>${item.filename}</small><br>
                            <small style="color: #666;">Path: ${displayPath}</small>
                        `;
                        grid.appendChild(div);
                    });
                }
            })
            .catch(error => {
                document.getElementById('status').textContent = 'Error: ' + error.message;
                console.error('Error:', error);
            });
        }
        
        // Cargar automáticamente
        testAPI();
    </script>
</body>
</html>
