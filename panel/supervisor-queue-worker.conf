[program:strupeni-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/strupeni/panel/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/strupeni/panel/storage/logs/queue-worker.log
stopwaitsecs=3600
stderr_logfile=/var/www/strupeni/panel/storage/logs/queue-worker-error.log

; ========================================
; CONFIGURACIÓN DE SUPERVISOR
; ========================================
;
; Este archivo configura Supervisor para mantener
; el Laravel queue worker corriendo constantemente
;
; INSTALACIÓN EN SERVIDOR LINUX:
; 1. Copiar este archivo a: /etc/supervisor/conf.d/
; 2. Ajustar las rutas según tu servidor
; 3. Ejecutar:
;    sudo supervisorctl reread
;    sudo supervisorctl update
;    sudo supervisorctl start strupeni-queue-worker:*
;
; COMANDOS ÚTILES:
; - Ver estado: sudo supervisorctl status
; - Reiniciar: sudo supervisorctl restart strupeni-queue-worker:*
; - Detener: sudo supervisorctl stop strupeni-queue-worker:*
; - Ver logs: tail -f /var/www/strupeni/panel/storage/logs/queue-worker.log
;
; IMPORTANTE:
; Después de actualizar código, siempre reiniciar:
; sudo supervisorctl restart strupeni-queue-worker:*
; o desde Laravel: php artisan queue:restart
